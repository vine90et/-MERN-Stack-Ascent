<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        display: flex;
        justify-content: center;
        background: linear-gradient(45deg, #0b0c10, #1f2833, #16222a);

    }
    #root{
        padding: 8px;
        border-radius: 12px;
        text-align: center;
        margin-top: 100px;
        border: 2px solid black;
        background: linear-gradient(45deg,#e6ccb2,#aec3b0);
        height: fit-content;
        width:fit-content;
    }
</style>
<body>
    <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">

      function Header({name,title,para}){
        return(
        <header className="card">
            <h1 className='header-name'>{name}</h1>
            <h2 className='header-title'>{title}</h2>
            <p className='para'>{para}</p>
        </header>
        )
      }
      function App(){
          return(
              <Header name='Vineet' title='Frontend Developer' para='Passionate frontend developer crafting seamless, responsive, and user-friendly web experiences.' />
          )
      }

      const root = ReactDOM.createRoot(document.getElementById('root'))
      root.render(<App />)
    </script>
</body>
</html>
